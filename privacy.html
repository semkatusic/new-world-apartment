<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy</title></head>
<body style="font-family:Inter,Arial,sans-serif;background:#f7f2e8;margin:0;padding:40px;">
<div style="max-width:800px;margin:auto;background:white;padding:40px;line-height:1.7;">
<h1 data-i18n="title">Privacy Policy</h1>
<div data-i18n="text"></div>
<p><a id="backHome" href="/">← Back to homepage</a></p>
</div>
<script>
const t={
"pt-br":{"title":"Política de privacidade","text":"<p>Os dados pessoais são tratados de acordo com o Regulamento Geral de Proteção de Dados (RGPD/GDPR).</p><h2>Dados tratados</h2><p>Nome, e-mail, número de telefone, datas da reserva, situação do pagamento e mensagens podem ser tratados para organizar reservas e comunicar-se com os hóspedes.</p><h2>Pagamentos</h2><p>Este site não processa pagamentos diretamente. As condições de pagamento para solicitações de reserva direta são informadas individualmente. Reservas realizadas por plataformas externas seguem as práticas de pagamento e privacidade dessas plataformas.</p><h2>Plataformas externas</h2><p>Reservas realizadas por meio do Airbnb ou Booking.com estão sujeitas às políticas de privacidade das respectivas plataformas.</p><h2>Solicitações de reserva enviadas pelo site</h2><p>Ao enviar o formulário, tratamos seu nome, sobrenome, endereço de e-mail, telefone (opcional), datas de chegada e saída, número de hóspedes e mensagem para responder à solicitação e organizar uma possível estadia (art. 6º, nº 1, alínea b, do RGPD, medidas pré-contratuais). Utilizamos o serviço Resend para enviar o e-mail com a solicitação. Os dados do formulário são transmitidos do servidor do site para o Resend e entregues à nossa caixa de entrada do Gmail (Google). Esses prestadores podem tratar dados técnicos de entrega, como horários, endereços IP e registros de envio. Eventuais transferências internacionais de dados estão sujeitas às medidas de proteção de dados dos respectivos prestadores. Mais informações: https://resend.com/legal/privacy-policy e https://policies.google.com/privacy. Evite inserir dados pessoais sensíveis no campo de mensagem. Conservamos os registros de solicitações somente pelo período necessário para responder e cumprir obrigações legais de retenção. Para informações sobre o armazenamento e o exercício de seus direitos de proteção de dados, entre em contato pelo e-mail ns.apartment9@gmail.com.</p><h2>Seus direitos</h2><p>Você pode solicitar acesso, correção ou exclusão de seus dados pelo e-mail ns.apartment9@gmail.com.</p>"},
en:{title:"Privacy Policy",text:"<p>Personal data is processed according to GDPR.</p><h2>Data processed</h2><p>Name, email, phone number, booking dates, payment status and messages may be processed for booking and guest communication.</p><h2>Payments</h2><p>No payments are processed directly through this website. Payment arrangements for direct inquiries are communicated individually. Bookings made through external platforms are subject to their payment and privacy practices.</p><h2>Platforms</h2><p>Bookings through Airbnb or Booking.com are subject to the privacy policies of those platforms.</p><h2>Booking inquiries sent through our website</h2><p>When you submit the inquiry form, we process your name, email address, optionally your phone number, arrival and departure dates, number of guests and message to respond to your inquiry and arrange a possible stay (GDPR Art. 6(1)(b), pre-contractual measures). To deliver the inquiry email we use Resend, an email delivery provider. The form information is transmitted from our website server to Resend and delivered to our Gmail inbox (Google). Providers may process technical delivery data such as timestamps, IP addresses and delivery logs. Any international transfers are subject to the relevant providers' data-protection arrangements. More information: https://resend.com/legal/privacy-policy and https://policies.google.com/privacy. Please avoid sending sensitive personal data in the message field. We retain booking-inquiry records only as long as necessary to respond and comply with applicable legal retention duties. You can request information about storage and exercise your GDPR rights through ns.apartment9@gmail.com.</p><h2>Your rights</h2><p>You may request access, correction or deletion of your data by contacting ns.apartment9@gmail.com.</p>"},
de:{title:"Datenschutzerklärung",text:"<p>Personenbezogene Daten werden gemäß DSGVO verarbeitet.</p><h2>Verarbeitete Daten</h2><p>Name, E-Mail, Telefonnummer, Buchungsdaten, Zahlungsstatus und Nachrichten können zur Buchungsabwicklung und Gästekommunikation verarbeitet werden.</p><h2>Zahlungen</h2><p>Über diese Website werden derzeit keine Zahlungen abgewickelt. Zahlungsmodalitäten für Direktanfragen werden individuell mitgeteilt. Bei Buchungen über externe Plattformen gelten deren Zahlungs- und Datenschutzbestimmungen.</p><h2>Plattformen</h2><p>Buchungen über Airbnb oder Booking.com unterliegen den Datenschutzbestimmungen der jeweiligen Plattform.</p><h2>Buchungsanfragen über das Website-Formular</h2><p>Wenn Sie eine Anfrage absenden, verarbeiten wir Vor- und Nachname, E-Mail-Adresse, gegebenenfalls Telefonnummer, An- und Abreisedatum, Gästezahl und Nachricht, um Ihre Anfrage zu beantworten und einen möglichen Aufenthalt vorzubereiten (Art. 6 Abs. 1 lit. b DSGVO, vorvertragliche Maßnahmen). Für die technische Übermittlung der Anfrage-E-Mail verwenden wir Resend als E-Mail-Versanddienst. Die Formulardaten werden über unseren Webserver an Resend und anschließend an unser Gmail-Postfach (Google) übertragen. Dabei können die Dienstleister technische Versanddaten wie Zeitpunkte, IP-Adressen und Zustellprotokolle verarbeiten. Etwaige internationale Übermittlungen unterliegen den jeweiligen Datenschutzregelungen der Anbieter. Weitere Informationen: https://resend.com/legal/privacy-policy und https://policies.google.com/privacy. Bitte übermitteln Sie keine sensiblen personenbezogenen Daten im Nachrichtenfeld. Anfragedaten werden nur so lange aufbewahrt, wie dies zur Bearbeitung oder aufgrund gesetzlicher Aufbewahrungspflichten erforderlich ist. Datenschutzanfragen und Betroffenenrechte: ns.apartment9@gmail.com.</p><h2>Ihre Rechte</h2><p>Sie können Auskunft, Berichtigung oder Löschung Ihrer Daten verlangen: ns.apartment9@gmail.com.</p>"},
hr:{title:"Politika privatnosti",text:"<p>Osobni podaci obrađuju se prema GDPR pravilima.</p><h2>Podaci koji se obrađuju</h2><p>Ime, e-mail, broj telefona, datumi rezervacije, status plaćanja i poruke mogu se obrađivati za rezervacije i komunikaciju s gostima.</p><h2>Plaćanja</h2><p>Putem ove internetske stranice trenutačno se ne obrađuju plaćanja. Uvjeti plaćanja za izravne upite dogovaraju se pojedinačno. Za rezervacije putem vanjskih platformi vrijede njihova pravila plaćanja i privatnosti.</p><h2>Platforme</h2><p>Rezervacije putem Airbnb-a ili Booking.com-a podliježu pravilima privatnosti tih platformi.</p><h2>Upiti za rezervaciju putem internetskog obrasca</h2><p>Kada pošaljete upit, obrađujemo ime, prezime, adresu e-pošte, po potrebi telefonski broj, datume dolaska i odlaska, broj gostiju i poruku kako bismo odgovorili na upit i pripremili mogući boravak (čl. 6. st. 1. t. b GDPR-a, predugovorne radnje). Za tehničko slanje poruke koristimo pružatelja usluge slanja e-pošte Resend. Podaci iz obrasca prenose se putem našeg mrežnog poslužitelja servisu Resend, a zatim u naš Gmail sandučić (Google). Pružatelji usluga mogu obrađivati tehničke podatke o isporuci, uključujući vrijeme, IP adrese i zapisnike dostave. Mogući međunarodni prijenosi podataka podliježu pravilima zaštite podataka tih pružatelja. Više informacija: https://resend.com/legal/privacy-policy i https://policies.google.com/privacy. Molimo ne unosite osjetljive osobne podatke u poruku. Upite čuvamo samo onoliko koliko je potrebno za obradu i zakonske obveze. Za pitanja o zaštiti podataka i ostvarivanje prava obratite se na ns.apartment9@gmail.com.</p><h2>Vaša prava</h2><p>Možete zatražiti pristup, ispravak ili brisanje podataka putem: ns.apartment9@gmail.com.</p>"}
};
const urlLang=new URLSearchParams(window.location.search).get("lang");
let l=urlLang||localStorage.getItem("nwa_lang")||localStorage.getItem("lang")||"en";
const supported = Object.prototype.hasOwnProperty.call(t,l) ? l : "en";
document.documentElement.lang=supported;
document.querySelectorAll("[data-i18n]").forEach(e=>{const key=e.dataset.i18n;e.innerHTML=t[supported][key]||t.en[key]||"";});
const home = {"en":"/","de":"/de/","hr":"/hr/","pt-br":"/pt-br/"};
document.getElementById("backHome").href=home[l]||"/";
if(l==="pt-br")document.getElementById("backHome").textContent="← Voltar à página inicial";
document.title=t[supported].title;
</script>
</body>
</html>
