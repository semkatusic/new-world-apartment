<h1 data-i18n="title">Privacy Policy</h1>
<div data-i18n="text"></div>
<p><a href="index.html">← Back</a></p>

<script>
const t={
en:{title:"Privacy Policy",text:"<p>Personal data is processed according to GDPR.</p><h2>Data processed</h2><p>Name, email, phone number, booking dates, payment status and messages may be processed for booking and guest communication.</p><h2>Payments</h2><p>Payments may be processed through Stripe and PayPal. Their privacy policies apply.</p><h2>Platforms</h2><p>Bookings through Airbnb or Booking.com are subject to the privacy policies of those platforms.</p><h2>Booking inquiries sent through our website</h2><p>When you submit the inquiry form, we process your name, email address, optionally your phone number, arrival and departure dates, number of guests and message to respond to your inquiry and arrange a possible stay (GDPR Art. 6(1)(b), pre-contractual measures). To deliver the inquiry email we use Resend, an email delivery provider. The form information is transmitted from our website server to Resend and delivered to our Gmail inbox (Google). Providers may process technical delivery data such as timestamps, IP addresses and delivery logs. Any international transfers are subject to the relevant providers' data-protection arrangements. More information: https://resend.com/legal/privacy-policy and https://policies.google.com/privacy. Please avoid sending sensitive personal data in the message field. We retain booking-inquiry records only as long as necessary to respond and comply with applicable legal retention duties. You can request information about storage and exercise your GDPR rights through ns.apartment9@gmail.com.</p><h2>Your rights</h2><p>You may request access, correction or deletion of your data by contacting ns.apartment9@gmail.com.</p>"},
de:{title:"Datenschutzerklärung",text:"<p>Personenbezogene Daten werden gemäß DSGVO verarbeitet.</p><h2>Verarbeitete Daten</h2><p>Name, E-Mail, Telefonnummer, Buchungsdaten, Zahlungsstatus und Nachrichten können zur Buchungsabwicklung und Gästekommunikation verarbeitet werden.</p><h2>Zahlungen</h2><p>Zahlungen können über Stripe und PayPal abgewickelt werden. Es gelten deren Datenschutzbestimmungen.</p><h2>Plattformen</h2><p>Buchungen über Airbnb oder Booking.com unterliegen den Datenschutzbestimmungen der jeweiligen Plattform.</p><h2>Buchungsanfragen über das Website-Formular</h2><p>Wenn Sie eine Anfrage absenden, verarbeiten wir Vor- und Nachname, E-Mail-Adresse, gegebenenfalls Telefonnummer, An- und Abreisedatum, Gästezahl und Nachricht, um Ihre Anfrage zu beantworten und einen möglichen Aufenthalt vorzubereiten (Art. 6 Abs. 1 lit. b DSGVO, vorvertragliche Maßnahmen). Für die technische Übermittlung der Anfrage-E-Mail verwenden wir Resend als E-Mail-Versanddienst. Die Formulardaten werden über unseren Webserver an Resend und anschließend an unser Gmail-Postfach (Google) übertragen. Dabei können die Dienstleister technische Versanddaten wie Zeitpunkte, IP-Adressen und Zustellprotokolle verarbeiten. Etwaige internationale Übermittlungen unterliegen den jeweiligen Datenschutzregelungen der Anbieter. Weitere Informationen: https://resend.com/legal/privacy-policy und https://policies.google.com/privacy. Bitte übermitteln Sie keine sensiblen personenbezogenen Daten im Nachrichtenfeld. Anfragedaten werden nur so lange aufbewahrt, wie dies zur Bearbeitung oder aufgrund gesetzlicher Aufbewahrungspflichten erforderlich ist. Datenschutzanfragen und Betroffenenrechte: ns.apartment9@gmail.com.</p><h2>Ihre Rechte</h2><p>Sie können Auskunft, Berichtigung oder Löschung Ihrer Daten verlangen: ns.apartment9@gmail.com.</p>"},
hr:{title:"Politika privatnosti",text:"<p>Osobni podaci obrađuju se prema GDPR pravilima.</p><h2>Podaci koji se obrađuju</h2><p>Ime, e-mail, broj telefona, datumi rezervacije, status plaćanja i poruke mogu se obrađivati za rezervacije i komunikaciju s gostima.</p><h2>Plaćanja</h2><p>Plaćanja se mogu obraditi putem Stripea i PayPala. Primjenjuju se njihove politike privatnosti.</p><h2>Platforme</h2><p>Rezervacije putem Airbnb-a ili Booking.com-a podliježu pravilima privatnosti tih platformi.</p><h2>Upiti za rezervaciju putem internetskog obrasca</h2><p>Kada pošaljete upit, obrađujemo ime, prezime, adresu e-pošte, po potrebi telefonski broj, datume dolaska i odlaska, broj gostiju i poruku kako bismo odgovorili na upit i pripremili mogući boravak (čl. 6. st. 1. t. b GDPR-a, predugovorne radnje). Za tehničko slanje poruke koristimo pružatelja usluge slanja e-pošte Resend. Podaci iz obrasca prenose se putem našeg mrežnog poslužitelja servisu Resend, a zatim u naš Gmail sandučić (Google). Pružatelji usluga mogu obrađivati tehničke podatke o isporuci, uključujući vrijeme, IP adrese i zapisnike dostave. Mogući međunarodni prijenosi podataka podliježu pravilima zaštite podataka tih pružatelja. Više informacija: https://resend.com/legal/privacy-policy i https://policies.google.com/privacy. Molimo ne unosite osjetljive osobne podatke u poruku. Upite čuvamo samo onoliko koliko je potrebno za obradu i zakonske obveze. Za pitanja o zaštiti podataka i ostvarivanje prava obratite se na ns.apartment9@gmail.com.</p><h2>Vaša prava</h2><p>Možete zatražiti pristup, ispravak ili brisanje podataka putem: ns.apartment9@gmail.com.</p>"}
};
let l=localStorage.getItem("nwa_lang")||localStorage.getItem("lang")||"en";
document.documentElement.lang=l;
document.querySelectorAll("[data-i18n]").forEach(e=>e.innerHTML=t[l][e.dataset.i18n]);
</script>
