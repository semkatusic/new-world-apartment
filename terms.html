<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Terms</title></head>
<body style="font-family:Inter,Arial,sans-serif;background:#f7f2e8;margin:0;padding:40px;">
<div style="max-width:800px;margin:auto;background:white;padding:40px;line-height:1.7;">
<h1 data-i18n="title">Booking Terms</h1>
<div data-i18n="text"></div>
<p><a id="backHome" href="/">← Back to homepage</a></p>
</div>
<script>
const t={
"pt-br":{"title":"Condições de reserva","text":"<h2>Reserva e pagamento</h2><p>O envio de uma solicitação não constitui uma reserva confirmada. A disponibilidade, o preço, a forma de pagamento e as condições de confirmação são acordados individualmente por escrito antes da confirmação de uma reserva direta.</p><h2>Check-in / Check-out</h2><p>Check-in a partir das 15h. Check-out até as 10h.</p><h2>Regras da acomodação</h2><ul><li>Proibido fumar</li><li>Animais de estimação não são permitidos</li><li>Festas e eventos não são permitidos</li><li>O apartamento só pode ser utilizado por hóspedes registrados</li></ul><h2>Notas fiscais / comprovantes</h2><p>Comprovantes são emitidos mediante solicitação. Locação particular – sem cobrança de IVA (PDV).</p><h2>Reservas por plataformas externas</h2><p>Reservas realizadas pelo Airbnb ou Booking.com estão sujeitas às condições das respectivas plataformas.</p>"},
en:{title:"Booking Terms",text:"<h2>Booking & payment</h2><p>Sending an inquiry does not create a reservation. Availability, price, payment method and confirmation conditions are agreed individually in writing before a direct booking is confirmed.</p><h2>Check-in / Check-out</h2><p>Check-in from 15:00. Check-out until 10:00.</p><h2>House rules</h2><ul><li>No smoking</li><li>No pets</li><li>No parties or events</li><li>The apartment may only be used by registered guests</li></ul><h2>Invoices</h2><p>Invoices are issued on request. Private rental – no VAT charged.</p><h2>Platform bookings</h2><p>Bookings through Airbnb or Booking.com are subject to the terms of those platforms.</p>"},
de:{title:"Buchungsbedingungen / AGB",text:"<h2>Buchung & Zahlung</h2><p>Eine Anfrage ist noch keine Buchung. Verfügbarkeit, Preis, Zahlungsart und Bedingungen der Buchungsbestätigung werden vor einer Direktbuchung individuell schriftlich vereinbart.</p><h2>Check-in / Check-out</h2><p>Check-in ab 15:00 Uhr. Check-out bis 10:00 Uhr.</p><h2>Hausregeln</h2><ul><li>Rauchen verboten</li><li>Keine Haustiere</li><li>Keine Partys oder Veranstaltungen</li><li>Das Apartment darf nur von angemeldeten Gästen genutzt werden</li></ul><h2>Rechnungen</h2><p>Rechnungen werden auf Anfrage ausgestellt. Privatvermietung – keine Umsatzsteuer ausgewiesen.</p><h2>Plattformbuchungen</h2><p>Für Buchungen über Airbnb oder Booking.com gelten die Bedingungen der jeweiligen Plattform.</p>"},
hr:{title:"Uvjeti rezervacije",text:"<h2>Rezervacija i plaćanje</h2><p>Slanje upita ne znači potvrđenu rezervaciju. Dostupnost, cijena, način plaćanja i uvjeti potvrde izravne rezervacije dogovaraju se pojedinačno u pisanom obliku.</p><h2>Prijava / odjava</h2><p>Prijava od 15:00. Odjava do 10:00.</p><h2>Kućni red</h2><ul><li>Pušenje je zabranjeno</li><li>Kućni ljubimci nisu dozvoljeni</li><li>Zabave i događanja nisu dozvoljeni</li><li>Apartman smiju koristiti samo prijavljeni gosti</li></ul><h2>Računi</h2><p>Računi se izdaju na zahtjev. Privatni najam – PDV nije obračunat.</p><h2>Rezervacije putem platformi</h2><p>Za rezervacije putem Airbnb-a ili Booking.com-a vrijede uvjeti tih platformi.</p>"}
};
const urlLang=new URLSearchParams(window.location.search).get("lang");
let l=urlLang||localStorage.getItem("nwa_lang")||localStorage.getItem("lang")||"en";
const supported = Object.prototype.hasOwnProperty.call(t,l) ? l : "en";
document.documentElement.lang=supported;
document.querySelectorAll("[data-i18n]").forEach(e=>{const key=e.dataset.i18n;e.innerHTML=t[supported][key]||t.en[key]||"";});
const home = {"en":"/","de":"/de/","hr":"/hr/","pt-br":"/pt-br/"};
document.getElementById("backHome").href=home[l]||"/";
if(l==="pt-br")document.getElementById("backHome").textContent="← Voltar à página inicial";
document.title=t[supported].title;
</script>
</body>
</html>
